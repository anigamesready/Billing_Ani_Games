
name: Build Ani Games APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded project ZIP
        run: |
          unzip -o billing_ani_games-github-ready.zip -d project
          find project -maxdepth 5 -type f | head -100

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          SETTINGS_FILE="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: ZIP tidak berisi settings.gradle atau settings.gradle.kts."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found at: $PROJECT_DIR"

      - name: Build APK
        run: gradle --no-daemon -p "${{ steps.locate.outputs.project_dir }}" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ani-Games-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
