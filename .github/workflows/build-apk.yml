
name: Build Ani Games APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 3 -type f \
            -iname 'billing_ani_games-github-ready.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP proyek tidak ditemukan."
            exit 1
          fi

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "ZIP ditemukan: $ZIP_FILE"

      - name: Extract project
        shell: bash
        run: |
          mkdir -p project
          unzip -o "${{ steps.zip.outputs.zip_file }}" -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager -print -quit)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        shell: bash
        run: |
          if ! command -v gradle >/dev/null 2>&1; then
            curl -fL \
              https://services.gradle.org/distributions/gradle-8.9-bin.zip \
              -o /tmp/gradle.zip

            sudo unzip -q /tmp/gradle.zip -d /opt
            echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"
            export PATH="/opt/gradle-8.9/bin:$PATH"
          fi

          gradle --version

      - name: Find Android project
        id: project
        shell: bash
        run: |
          SETTINGS_FILE="$(find project -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: File settings.gradle tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Proyek Android: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Find and prepare APK
        shell: bash
        run: |
          APK_FILE="$(find project -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK belum berhasil dibuat."
            exit 1
          fi

          mkdir -p output
          cp "$APK_FILE" output/Ani-Games-debug.apk
          ls -lh output/Ani-Games-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ani-Games-APK
          path: output/Ani-Games-debug.apk
          if-no-files-found: error
          retention-days: 14
