name: Build Ani Games APK

on:
push:
branches: [main]
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Extract uploaded project ZIP
    run: |
      unzip -o billing_ani_games-github-ready.zip -d project
      find project -maxdepth 4 -type f | head -100

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Locate Android project
    run: |
      find project -name settings.gradle -o -name settings.gradle.kts
      find project -name gradlew

  - name: Build APK
    run: |
      cd "$(dirname "$(find project -name settings.gradle -o -name settings.gradle.kts | head -1)")"
      gradle --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Ani-Games-APK
      path: project/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
