name: Build Ani Games APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find newest Android source ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*GITHUB-BUILD*.zip' -print | sort -V | tail -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::ZIP Android tidak ditemukan. Upload ZIP dengan nama yang mengandung GITHUB-BUILD."
            find . -maxdepth 3 -type f -iname '*.zip' -print
            exit 1
          fi
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "ZIP terpilih: $ZIP_FILE"

      - name: Extract and validate Android project and API key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project
          unzip -oq "${{ steps.zip.outputs.zip_file }}" -d project
          SETTINGS="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle tidak ditemukan di dalam ZIP."
            find project -maxdepth 5 -type f | head -100
            exit 1
          fi
          ANDROID_DIR="$(dirname "$SETTINGS")"
          if [ ! -f "$ANDROID_DIR/app/build.gradle" ] && [ ! -f "$ANDROID_DIR/app/build.gradle.kts" ]; then
            echo "::error::File build.gradle untuk app tidak ditemukan di $ANDROID_DIR/app."
            exit 1
          fi
          if grep -R -n 'sb_publishable_1Jsp3ZQDLwtozZ2hSPO83YA_7e1j723g' "$ANDROID_DIR/app/src/main/assets/web"; then
            echo "::error::Source ZIP contains the rejected API key from the previous APK."
            exit 1
          fi
          if ! grep -R -q 'sb_publishable_DobdCrOd43-vluON5gV7hg_6Js2Ea5V' "$ANDROID_DIR/app/src/main/assets/web"; then
            echo "::error::Expected API key from the Web master was not found in the app web assets."
            exit 1
          fi
          echo "API key source check passed."
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platforms
        shell: bash
        run: |
          sdkmanager "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Find and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE="$(find "$ANDROID_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$APK_FILE" ]; then
            echo "::error::APK tidak ditemukan setelah build."
            exit 1
          fi
          mkdir -p output
          cp "$APK_FILE" output/Ani-Games-Billing-v11.29.1-APIKEY-FIX-debug.apk
          ls -lh output/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ani-Games-Billing-v11.29.1-APIKEY-FIX
          path: output/*.apk
          if-no-files-found: error
          retention-days: 14
