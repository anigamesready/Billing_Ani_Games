
name: Build Ani Games APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 3 -type f \
            -iname 'billing_ani_games-github-ready.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP proyek tidak ditemukan."
            exit 1
          fi

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "ZIP ditemukan: $ZIP_FILE"

      - name: Extract project
        shell: bash
        run: |
          mkdir -p project
          unzip -o "${{ steps.zip.outputs.zip_file }}" -d project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platforms
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Find Android project
        id: project
        shell: bash
        run: |
          SETTINGS_FILE="project/android/settings.gradle"

          if [ ! -f "$SETTINGS_FILE" ]; then
            echo "ERROR: project/android/settings.gradle tidak ditemukan."
            find project -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \)
            exit 1
          fi

          echo "project_dir=project/android" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Find and prepare APK
        shell: bash
        run: |
          APK_FILE="$(find project/android -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK tidak ditemukan setelah build."
            exit 1
          fi

          mkdir -p output
          cp "$APK_FILE" output/Ani-Games-debug.apk
          ls -lh output/Ani-Games-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ani-Games-APK
          path: output/Ani-Games-debug.apk
          if-no-files-found: error
          retention-days: 14
