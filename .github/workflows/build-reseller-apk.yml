name: Build Ani-Games Reseller APK

on:
  push:
    branches:
      - reseller-v1.0.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compile Reseller Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35 packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Apply reseller-only UI and package settings
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP="Ani-Games-Billing-Android-GITHUB-BUILD-v11.29.1-APIKEY-FIX-ICON.zip"
          test -f "$SOURCE_ZIP" || { echo "::error::Baseline Android source ZIP missing"; exit 1; }
          mkdir -p project
          unzip -oq "$SOURCE_ZIP" -d project
          SETTINGS="$(find project -type f -name settings.gradle -print -quit)"
          test -n "$SETTINGS" || { echo "::error::settings.gradle missing"; exit 1; }
          ANDROID_DIR="$(dirname "$SETTINGS")"
          export ANDROID_DIR
          WEB_DIR="$ANDROID_DIR/app/src/main/assets/web"
          test -d "$WEB_DIR" || { echo "::error::WebView assets missing"; exit 1; }
          tar -xzf reseller/ui-v1.0.0.tar.gz -C "$WEB_DIR"

          python3 - <<'PY'
          import os
          from pathlib import Path

          android = Path(os.environ["ANDROID_DIR"])
          gradle = android / "app/build.gradle"
          text = gradle.read_text()
          replacements = {
              "namespace 'com.anigames.billingadmin'": "namespace 'com.anigames.reseller'",
              "applicationId 'com.anigames.billingadmin'": "applicationId 'com.anigames.reseller'",
              "versionCode 30": "versionCode 100",
              "versionName '11.29.1'": "versionName '1.0.0'",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit("Expected Gradle baseline setting not found: " + old)
              text = text.replace(old, new, 1)
          gradle.write_text(text)

          manifest = android / "app/src/main/AndroidManifest.xml"
          m = manifest.read_text()
          if 'android:label="Ani Games Billing Admin"' not in m:
              raise SystemExit("Expected baseline app label not found")
          manifest.write_text(m.replace('android:label="Ani Games Billing Admin"',
                                         'android:label="Ani-Games Reseller"', 1))

          old_java = android / "app/src/main/java/com/anigames/billingadmin/MainActivity.java"
          new_java = android / "app/src/main/java/com/anigames/reseller/MainActivity.java"
          if not old_java.exists():
              raise SystemExit("Baseline MainActivity not found")
          new_java.parent.mkdir(parents=True, exist_ok=True)
          java = old_java.read_text()
          if "package com.anigames.billingadmin;" not in java:
              raise SystemExit("Unexpected MainActivity package")
          new_java.write_text(java.replace("package com.anigames.billingadmin;",
                                           "package com.anigames.reseller;", 1))
          old_java.unlink()

          settings = android / "settings.gradle"
          if settings.exists():
              s = settings.read_text().replace("AniGamesBillingAdmin", "AniGamesReseller")
              settings.write_text(s)
          PY

          # Remove admin/database and legacy duplicate HTML entry points from the APK.
          rm -f "$WEB_DIR/admin.html" "$WEB_DIR/billing.html" "$WEB_DIR/v11-cloud.js"
          rm -f "$WEB_DIR/icon/admin-control.html" "$WEB_DIR/icon/admin.html"
          rm -f "$WEB_DIR/icon/billing.html" "$WEB_DIR/icon/index.html"
          rm -f "$WEB_DIR/icon/v11-cloud.js" "$WEB_DIR/icon/background.jpg"

          # Validate the UI, public key, separate app ID, and both logo placements.
          test -s "$WEB_DIR/icon/logo.png"
          test -s "$ANDROID_DIR/app/src/main/res/mipmap-mdpi/ic_launcher.png"
          test -s "$ANDROID_DIR/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"
          grep -q 'icon/logo.png' "$WEB_DIR/index.html"
          grep -q 'icon/logo.png' "$WEB_DIR/admin-control.html"
          ! grep -q 'Tidak ada akses Admin DB, Windows, atau pairing' "$WEB_DIR/index.html"
          grep -q "applicationId 'com.anigames.reseller'" "$ANDROID_DIR/app/build.gradle"
          grep -q 'android:label="Ani-Games Reseller"' "$ANDROID_DIR/app/src/main/AndroidManifest.xml"
          test ! -e "$WEB_DIR/admin.html"
          test ! -e "$WEB_DIR/billing.html"
          test ! -e "$WEB_DIR/icon/admin.html"
          test ! -e "$WEB_DIR/icon/billing.html"
          if grep -R -n -E 'billing_command|billing_start_trial|admin_disconnect_device|billing_delete_rental|restart_pc|shutdown|logoff|start_trial|queue_command' "$WEB_DIR" --include='*.html'; then
            echo "::error::Restricted control capability found in reseller HTML"
            exit 1
          fi
          if grep -R -n 'sb_publishable_1Jsp3ZQDLwtozZ2hSPO83YA_7e1j723g' "$WEB_DIR" --include='*.html'; then
            echo "::error::Rejected API key found"
            exit 1
          fi
          grep -R -q 'sb_publishable_DobdCrOd43-vluON5gV7hg_6Js2Ea5V' "$WEB_DIR" --include='*.html'
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Reseller assets/logo/package/API-key checks passed."

      - name: Compile debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace -p "$ANDROID_DIR" assembleDebug

      - name: Prepare and verify APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp "$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk" output/Ani-Games-Reseller-v1.0.0-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging output/Ani-Games-Reseller-v1.0.0-debug.apk > output/apk-badging.txt
          grep -q "package: name='com.anigames.reseller'" output/apk-badging.txt
          grep -q "application-label:'Ani-Games Reseller'" output/apk-badging.txt
          ls -lh output/Ani-Games-Reseller-v1.0.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ani-Games-Reseller-v1.0.0-debug-apk
          path: output/Ani-Games-Reseller-v1.0.0-debug.apk
          if-no-files-found: error
          retention-days: 30
