name: Ani-Games Billing Android V12 — build isolated patch
on:
  push:
    branches: [patch/v12-db-routing]
    paths:
      - '.github/workflows/build-v12-dual-db.yml'
      - 'scripts/v12/patch_android_v12.py'
      - 'scripts/v12/test_android_v12.py'
      - 'Ani-Games-Billing-Android-GITHUB-BUILD-v11.29.1-APIKEY-FIX-ICON.zip'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android-v12:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Extract untouched locked V11.29.1 source
        shell: bash
        run: |
          set -euo pipefail
          SRC="Ani-Games-Billing-Android-GITHUB-BUILD-v11.29.1-APIKEY-FIX-ICON.zip"
          test -s "$SRC"
          unzip -t "$SRC" | tail -2
          mkdir -p "$RUNNER_TEMP/v12-original" "$RUNNER_TEMP/v12-build"
          unzip -oq "$SRC" -d "$RUNNER_TEMP/v12-original"
          cp -a "$RUNNER_TEMP/v12-original/." "$RUNNER_TEMP/v12-build/"
          echo "ANDROID_ORIGINAL=$RUNNER_TEMP/v12-original/android" >> "$GITHUB_ENV"
          echo "ANDROID_DIR=$RUNNER_TEMP/v12-build/android" >> "$GITHUB_ENV"
      - name: Apply V12 dual-DB route preflight and mobile layout patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/v12/patch_android_v12.py "$ANDROID_DIR"
          python3 scripts/v12/test_android_v12.py "$ANDROID_ORIGINAL" "$ANDROID_DIR"
      - name: Audit JavaScript syntax and public client keys
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$ANDROID_DIR/app/src/main/assets/web" <<'PY'
          import re, subprocess, sys
          from pathlib import Path
          root=Path(sys.argv[1]); checked=0
          for html in root.glob('*.html'):
              body=html.read_text(encoding='utf-8',errors='replace')
              for i,m in enumerate(re.finditer(r'<script\b([^>]*)>(.*?)</script\s*>',body,re.I|re.S),1):
                  if re.search(r'\bsrc\s*=',m.group(1),re.I) or not m.group(2).strip(): continue
                  path=Path('/tmp')/f'v12-{html.stem}-{i}.js'
                  path.write_text(m.group(2),encoding='utf-8')
                  subprocess.run(['node','--check',str(path)],check=True)
                  checked+=1
          subprocess.run(['node','--check',str(root/'v11-cloud.js')],check=True);checked+=1
          text='\n'.join(p.read_text(errors='replace') for p in root.rglob('*') if p.is_file() and p.suffix.lower() in ('.html','.js'))
          for key in ('sb_publishable_DobdCrOd43-vluON5gV7hg_6Js2Ea5V','sb_publishable_FjhnRZeXPnomlGRw75YLxw_d46R2Lag'):
              if key not in text: raise SystemExit('Required public publishable key missing')
          if 'sb_publishable_1Jsp3ZQDLwtozZ2hSPO83YA_7e1j723g' in text: raise SystemExit('Rejected legacy publishable key found')
          if 'service_role' in text.lower(): raise SystemExit('Service-role text found in client assets')
          print(f'PASS: syntax checked for {checked} inline/linked scripts; public-key scan passed')
          PY
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p "$ANDROID_DIR" assembleDebug
          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p output
          cp "$APK" output/Ani-Games-Billing-v12.0.0-debug.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          test -n "$AAPT" && test -n "$APKSIGNER"
          "$AAPT" dump badging output/Ani-Games-Billing-v12.0.0-debug.apk | tee output/apk-badging.txt
          grep -q "package: name='com.anigames.billingadmin' versionCode='31' versionName='12.0.0'" output/apk-badging.txt
          "$APKSIGNER" verify --verbose output/Ani-Games-Billing-v12.0.0-debug.apk
          (cd "$RUNNER_TEMP/v12-build" && zip -qr "$GITHUB_WORKSPACE/output/Ani-Games-Billing-Android-SOURCE-v12.0.0.zip" android)
          {
            echo 'Ani-Games Billing Android V12 build'
            echo "Build source: Ani-Games-Billing-Android-GITHUB-BUILD-v11.29.1-APIKEY-FIX-ICON.zip"
            echo 'Route behavior: read-only preflight on DB1+DB2; mismatch/unavailable DB blocks backend actions'
            echo 'Production route switch: NOT performed'
            echo 'Hardware/device end-to-end validation: NOT performed by CI'
            echo 'V11 main branch/baseline: unchanged'
          } > output/BUILD-REPORT.txt
          sha256sum output/Ani-Games-Billing-v12.0.0-debug.apk output/Ani-Games-Billing-Android-SOURCE-v12.0.0.zip | tee output/SHA256SUMS.txt
          ls -lh output
      - name: Upload V12 build and source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ani-Games-Billing-Android-V12-debug-build
          path: output/*
          if-no-files-found: error
          retention-days: 30
