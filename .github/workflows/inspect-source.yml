name: Audit Android Billing Source
on:
  push:
    branches:
      - "audit/**"
    paths:
      - ".github/workflows/inspect-source.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inventory Android source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Ani-Games-Billing-Android-GITHUB-BUILD-v11.29.1-APIKEY-FIX-ICON.zip"
          test -s "$ZIP"
          unzip -t "$ZIP"
          mkdir -p inspect
          unzip -oq "$ZIP" -d inspect
          find inspect -type f -printf '%s  %P\n' | sort > inventory.txt
          python3 - <<'PY'
          from pathlib import Path
          root = Path("inspect")
          settings = [p for p in root.rglob("*") if p.name in ("settings.gradle", "settings.gradle.kts")]
          html = sorted(root.rglob("*.html"))
          js = sorted(root.rglob("*.js"))
          lines = ["SETTINGS_GRADLE:", *[str(p) for p in settings], "HTML_FILES:", *[str(p) for p in html], "JS_FILES:", *[str(p) for p in js], "MATCHES:"]
          terms = ("rental", "delete", "hapus", "nonaktif", "shutdown", "restart", "logoff", "windows", "device", "pc", "billing_command", "admin_command")
          for p in html + js:
              try: data = p.read_text(errors="replace")
              except Exception: continue
              for n, line in enumerate(data.splitlines(), 1):
                  if any(t in line.lower() for t in terms):
                      lines.append(f"{p}:{n}:{line.strip()[:240]}")
          Path("source-analysis.txt").write_text("\n".join(lines))
          PY
          tar -czf extracted-billing-source.tar.gz -C inspect .
      - uses: actions/upload-artifact@v4
        with:
          name: billing-android-source-inspection
          path: |
            extracted-billing-source.tar.gz
            inventory.txt
            source-analysis.txt
          if-no-files-found: error
          retention-days: 7
